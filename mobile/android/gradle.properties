# Sized for an 8 GB laptop shared with VS Code and a browser: one Gradle JVM of at most 2 GB, the Kotlin
# compiler inside it (not a second JVM), and one worker. The Flutter template default (-Xmx8G) gets the
# build killed by the system when memory runs out.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=640m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=1
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.enableJetifier=true
